<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문짝 타공 스케치</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="logo">▯</span><div>문짝 타공 스케치<small>DOOR CUTOUT PLANNER</small></div></div><span class="tag">치수 입력 → 이미지 복사</span></header>
<main><aside><div class="intro"><span class="eyebrow">간편 도면 도구</span><h1>치수를 넣고,<br>비율을 확인하세요.</h1><p>모든 치수의 단위는 mm입니다.</p></div><form id="controls">
<section><h2><b>01</b> 문짝 크기</h2><div class="grid"><label>가로<input id="dw" type="number" value="833" min="1" max="10000" step="any"></label><label>세로<input id="dh" type="number" value="2060" min="1" max="10000" step="any"></label></div></section>
<section><h2><b>02</b> 사각 타공</h2><div class="grid"><label>가로<input id="cw" type="number" value="120" min="1" max="10000" step="any"></label><label>세로<input id="ch" type="number" value="1000" min="1" max="10000" step="any"></label></div><label>상단 여백<input id="top" type="number" value="120" min="0" max="10000" step="any"></label><label>가로 위치<select id="align"><option value="left">왼쪽 기준</option><option value="center">좌우 중앙</option><option value="right">오른쪽 기준</option></select></label><label id="marginLabel"><span id="marginText">왼쪽 여백</span><input id="margin" type="number" value="120" min="0" max="10000" step="any"></label></section>
<section><h2><b>03</b> 손잡이 중심</h2><label>손잡이 방향<select id="side"><option value="left">왼쪽</option><option value="right">오른쪽</option></select></label><label>하단에서 높이<input id="hh" type="number" value="950" min="0" max="10000" step="any"></label></section>
</form><button class="reset" id="reset">기본 예시로 초기화 ↺</button></aside>
<article><div class="toolbar"><div><span class="live"></span> 실시간 미리보기 <span class="tag">정면 기준</span></div><button id="copy">이미지 복사</button><span id="copyStatus" role="status" aria-live="polite"></span></div><div class="presets"><span>빠른 예시</span><button id="ex1">상단 120 · 왼쪽 120</button><button id="ex2">상단 200 · 좌우 중앙</button></div><div id="error" role="alert" hidden></div><div class="paper"><svg id="drawing" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="문짝 및 사각 타공 치수 도면"></svg></div><footer><div><span class="swatch"></span> 사각 타공 <span class="handle-dot"></span> 손잡이 중심</div><p id="relation" aria-live="polite"></p></footer><div class="summary" id="summary"></div><p class="note">입력 치수에 비례한 스케치입니다. 손잡이 원은 중심 위치를 나타내는 기호입니다.</p></article></main><script src="app.js"></script></body></html>
